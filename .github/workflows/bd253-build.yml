name: BD-253 D3D9On12 bare-allocation build

on:
  push:
    branches:
      - try/d3d9on12-bare-allocation
      - fix/shared-resize-layout-20261111
    paths:
      - patches/NAGI_GDI1_shared_open_fix.patch
      - .github/workflows/bd253-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-msvc:
    name: Contract test (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Checkout exact upstream tester.37
        uses: actions/checkout@v4
        with:
          repository: D-Ogi/amdgpu-wddm
          ref: ec5326029afdc7950a2068ed5eece46a965b4eed
          path: upstream
          persist-credentials: false

      - name: Verify and apply patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches\NAGI_GDI1_shared_open_fix.patch'
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText)
          git -C upstream config core.autocrlf false
          git -C upstream reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not normalize upstream checkout: $LASTEXITCODE" }
          git -C upstream apply --recount --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $LASTEXITCODE" }
          git -C upstream apply --recount $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $LASTEXITCODE" }
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw "Whitespace check failed: $LASTEXITCODE" }
          $changed = @(git -C upstream diff --name-only)
          Write-Host ($changed -join "`n")
          if ($changed.Count -ne 3) { throw "Expected exactly 3 patched source files, got $($changed.Count)" }
          git -C upstream diff --stat

      - name: Initialize MSVC (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Compile contract test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location upstream
          try {
            cl.exe /nologo /std:c++17 /EHsc /W4 /WX /O2 /I driver\contract /I driver\kmd driver\contract\test\shared-surface-test.cpp /Fe:shared-surface-test.exe
            if ($LASTEXITCODE -ne 0) { throw "MSVC compile failed: $LASTEXITCODE" }
            .\shared-surface-test.exe
            if ($LASTEXITCODE -ne 0) { throw "Contract tests failed: $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }

      - name: Upload compiled contract-test binary
        uses: actions/upload-artifact@v4
        with:
          name: shared-surface-test-${{ matrix.arch }}
          path: upstream/shared-surface-test.exe
          if-no-files-found: error
