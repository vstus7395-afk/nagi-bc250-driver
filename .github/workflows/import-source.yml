name: Import Nagi source and build GDI1 test

on:
  push:
    paths:
      - "patches/**"
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-test:
    runs-on: windows-2022
    steps:
      - name: Check out this work repository
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Check out the exact Nagi source release
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.7.216.109-tester.37 --single-branch https://github.com/D-Ogi/amdgpu-wddm.git source
          if ($LASTEXITCODE -ne 0) { throw "Could not clone the upstream tester.37 source" }

      - name: Publish unmodified source branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -C source push "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" HEAD:refs/heads/upstream-tester.37

      - name: Apply patch and publish patched source branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -C source switch -c gdi1-experiment
          git -C source apply --check "$env:GITHUB_WORKSPACE/overlay/patches/NAGI_GDI1_shared_open_fix.patch"
          git -C source apply "$env:GITHUB_WORKSPACE/overlay/patches/NAGI_GDI1_shared_open_fix.patch"
          git -C source add driver/contract/bc250_shared_surface.h driver/umd/d3d12/engine-ddi/resources.cpp driver/contract/test/shared-surface-test.cpp
          git -C source -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Apply experimental GDI1 shared-surface compatibility patch"
          git -C source push "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" HEAD:refs/heads/gdi1-experiment

      - name: Compile and run shared-surface contract tests (x64 MSVC)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and execute contract test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location source
          try {
            cl.exe /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fe:shared-surface-test.exe driver/contract/test/shared-surface-test.cpp
            if ($LASTEXITCODE -ne 0) { throw "MSVC compile failed: $LASTEXITCODE" }
            .\shared-surface-test.exe
            if ($LASTEXITCODE -ne 0) { throw "Shared-surface contract tests failed: $LASTEXITCODE" }
          }
          finally {
            Pop-Location
          }
