name: BD-253 32-bit D3D12 UMD build

on:
  push:
    branches:
      - try/d3d9on12-bare-allocation
    paths:
      - patches/NAGI_GDI1_shared_open_fix.patch
      - .github/workflows/bd253-umd-x86.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-umd-x86:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Cache pinned Windows build toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain/nuget
            toolchain/llvm-23.1.4-win64
          key: windows-2022-bd253-tester37-sdk-wdk-llvm-23.1.4-v1

      - name: Checkout exact upstream tester.37
        uses: actions/checkout@v4
        with:
          repository: D-Ogi/amdgpu-wddm
          ref: v0.7.216.109-tester.37
          path: upstream
          persist-credentials: false

      - name: Checkout pinned vkd3d engine headers
        uses: actions/checkout@v4
        with:
          repository: D-Ogi/vkd3d-proton
          ref: 507890134f8e3e1313d45f03c6bbe7ddde8bda7a
          path: vkd3d-proton
          persist-credentials: false

      - name: Checkout pinned Vulkan headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ee2ec5fd83dafce291024683b50dc89219333076
          path: Vulkan-Headers
          persist-credentials: false

      - name: Verify and apply BD-253 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches\NAGI_GDI1_shared_open_fix.patch'
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText)
          git -C upstream config core.autocrlf false
          git -C upstream reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not normalize upstream checkout: $LASTEXITCODE" }
          git -C upstream apply --recount --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $LASTEXITCODE" }
          git -C upstream apply --recount $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $LASTEXITCODE" }
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw "Whitespace check failed: $LASTEXITCODE" }
          $changed = @(git -C upstream diff --name-only)
          Write-Host ($changed -join "`n")
          if ($changed.Count -ne 3) { throw "Expected exactly 3 patched source files, got $($changed.Count)" }
          git -C upstream diff --stat

      - name: Download pinned Windows SDK, WDK and D3D12 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nuget = Join-Path $env:GITHUB_WORKSPACE 'toolchain\nuget'
          New-Item -ItemType Directory -Force $nuget | Out-Null

          function Get-NugetPackage([string]$Id, [string]$Version, [string]$Destination) {
            $lower = $Id.ToLowerInvariant()
            $url = "https://api.nuget.org/v3-flatcontainer/$lower/$Version/$lower.$Version.nupkg"
            $archive = Join-Path $env:RUNNER_TEMP "$lower.$Version.nupkg"
            Write-Host "Downloading $Id $Version"
            Invoke-WebRequest -Uri $url -OutFile $archive
            New-Item -ItemType Directory -Force $Destination | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $Destination -Force
            Remove-Item -LiteralPath $archive -Force
          }

          $v26100 = '10.0.26100.6584'
          Get-NugetPackage 'Microsoft.Windows.WDK.x64' $v26100 (Join-Path $nuget 'microsoft.windows.wdk.x64')
          Get-NugetPackage 'Microsoft.Windows.SDK.cpp' $v26100 (Join-Path $nuget 'microsoft.windows.sdk.cpp')
          Get-NugetPackage 'Microsoft.Windows.SDK.cpp.x64' $v26100 (Join-Path $nuget 'microsoft.windows.sdk.cpp.x64')
          Get-NugetPackage 'Microsoft.Windows.SDK.cpp.x86' $v26100 (Join-Path $nuget 'microsoft.windows.sdk.cpp.x86')
          Get-NugetPackage 'Microsoft.Windows.WDK.x64' '10.0.28000.2526' (Join-Path $nuget 'wdk-28000.2526-um')
          Get-NugetPackage 'Microsoft.Direct3D.D3D12' '1.619.6' (Join-Path $nuget 'microsoft.direct3d.d3d12.1.619.6')

          $required = @(
            (Join-Path $nuget 'microsoft.windows.wdk.x64\c\Include\10.0.26100.0\um\d3d12umddi.h'),
            (Join-Path $nuget 'microsoft.windows.sdk.cpp\c\bin\10.0.26100.0\x64\dxc.exe'),
            (Join-Path $nuget 'wdk-28000.2526-um\c\Include\10.0.28000.0\um\d3d12umddi.h'),
            (Join-Path $nuget 'microsoft.direct3d.d3d12.1.619.6\build\native\include\d3d12.h')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required build input: $path" }
          }

      - name: Install pinned LLVM 23.1.4 for the DXIL signature gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $archive = Join-Path $env:RUNNER_TEMP 'clang-llvm-23.1.4-windows-x64.tar.xz'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/clang%2Bllvm-23.1.4-x86_64-pc-windows-msvc.tar.xz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '854bffcfc84528e0ee92490ff5c178920abd358a79c3e98f053e41e3e8e4c6d2') {
            throw "LLVM archive SHA-256 mismatch: $hash"
          }
          $llvm = Join-Path $root 'toolchain\llvm-23.1.4-win64'
          New-Item -ItemType Directory -Force $llvm | Out-Null
          tar.exe -xf $archive -C $llvm --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the official LLVM xz archive' }
          $clang = Join-Path $llvm 'bin\clang-cl.exe'
          if (-not (Test-Path -LiteralPath $clang)) { throw "LLVM archive lacks clang-cl.exe: $clang" }
          & $clang --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned clang-cl does not start' }
          Remove-Item -LiteralPath $archive -Force

      - name: Build 32-bit D3D12 UMD and engine-ddi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $out = Join-Path $root 'out\d3d12-umd-x86'
          $mesa = Join-Path $root 'mesa-header-root'
          New-Item -ItemType Directory -Force (Join-Path $mesa 'src\util') | Out-Null

          $wdk = Join-Path $root 'toolchain\nuget\microsoft.windows.wdk.x64\c\Include\10.0.26100.0\um'
          $api = Join-Path $root 'toolchain\nuget\microsoft.direct3d.d3d12.1.619.6\build\native\include'
          $engine = Join-Path $root 'vkd3d-proton\libs\ddi'
          $vulkan = Join-Path $root 'Vulkan-Headers\include'

          $header = Join-Path $engine 'bc250_vkd3d_engine.h'
          $headerText = [IO.File]::ReadAllText($header).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($header, $headerText)
          $headerHash = (Get-FileHash -Algorithm SHA256 $header).Hash.ToLowerInvariant()
          if ($headerHash -ne 'a87e47a9bf6327b784165ce0fb2046347e2d135c0716dd8c69823a5e108f2928') {
            throw "Pinned engine ABI header hash mismatch: $headerHash"
          }

          pwsh -NoProfile -File upstream\tools\build\build-umd-d3d12.ps1 -OutputDir $out -MesaSource $mesa -VulkanInclude $vulkan -EngineInclude $engine -Arch x86 -Compiler msvc -MsvcReason 'CI-only validation of the BD-253 D3D9On12 bare-allocation change' -DdiInclude $wdk -ApiInclude $api
          if ($LASTEXITCODE -ne 0) { throw "32-bit D3D12 UMD build failed: $LASTEXITCODE" }

          $dll = Join-Path $out 'amdgpu_wddm_d3d12.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw '32-bit D3D12 UMD DLL was not produced' }
          Get-FileHash -Algorithm SHA256 $dll | Format-List
          dumpbin.exe /headers $dll | Select-String -Pattern 'machine|14C|8664'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the built UMD DLL' }

      - name: Upload 32-bit D3D12 UMD test build
        uses: actions/upload-artifact@v4
        with:
          name: nagi-tester37-bd253-d3d12-umd-x86
          path: |
            out/d3d12-umd-x86/amdgpu_wddm_d3d12.dll
            out/d3d12-umd-x86/engine-ddi/engine-ddi.lib
            out/d3d12-umd-x86/engine-ddi/compiler.json
          if-no-files-found: error
