name: BD-253 32-bit D3D12 UMD build

on:
  push:
    branches:
      - try/d3d9on12-bare-allocation
    paths:
      - patches/NAGI_GDI1_shared_open_fix.patch
      - .github/workflows/bd253-umd-x86.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bd253-umd-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-umd-x86:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Cache pinned Windows build toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain/nuget
            toolchain/llvm-23.1.4-win64
          key: windows-2022-bd253-tester37-sdk-wdk-clang-v2
          save-always: true

      - name: Checkout exact upstream tester.37
        uses: actions/checkout@v4
        with:
          repository: D-Ogi/amdgpu-wddm
          ref: ec5326029afdc7950a2068ed5eece46a965b4eed
          path: upstream
          persist-credentials: false

      - name: Checkout pinned vkd3d engine headers
        uses: actions/checkout@v4
        with:
          repository: D-Ogi/vkd3d-proton
          ref: 47cf677139bb3f9b1e6e199d5a85dfa33a373076
          path: vkd3d-proton
          persist-credentials: false

      - name: Checkout exact x86 RADV Mesa host contract header
        uses: actions/checkout@v4
        with:
          repository: D-Ogi/mesa-amdgpu-wddm
          ref: 68fc203599c1ce0b7143fee6e41f9a552b2dacf9
          path: mesa
          sparse-checkout: |
            src/util
          sparse-checkout-cone-mode: true

      - name: Checkout pinned Vulkan headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ee2ec5fd83dafce291024683b50dc89219333076
          path: Vulkan-Headers
          persist-credentials: false

      - name: Verify and apply BD-253 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'patches\NAGI_GDI1_shared_open_fix.patch'
          $patchText = [IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $patchText)
          git -C upstream config core.autocrlf false
          git -C upstream reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not normalize upstream checkout: $LASTEXITCODE" }
          git -C upstream apply --recount --check $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $LASTEXITCODE" }
          git -C upstream apply --recount $patch
          if ($LASTEXITCODE -ne 0) { throw "Patch application failed: $LASTEXITCODE" }
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw "Whitespace check failed: $LASTEXITCODE" }
          $changed = @(git -C upstream diff --name-only)
          Write-Host ($changed -join "`n")
          if ($changed.Count -ne 3) { throw "Expected exactly 3 patched source files, got $($changed.Count)" }
          git -C upstream diff --stat

      - name: Download pinned Windows SDK, WDK and D3D12 headers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nuget = Join-Path $env:GITHUB_WORKSPACE 'toolchain\nuget'
          New-Item -ItemType Directory -Force $nuget | Out-Null

          function Get-NugetPackage([string]$Id, [string]$Version, [string]$Destination) {
            $lower = $Id.ToLowerInvariant()
            $url = "https://api.nuget.org/v3-flatcontainer/$lower/$Version/$lower.$Version.nupkg"
            $archive = Join-Path $env:RUNNER_TEMP "$lower.$Version.nupkg"
            Write-Host "Downloading $Id $Version"
            Invoke-WebRequest -Uri $url -OutFile $archive
            New-Item -ItemType Directory -Force $Destination | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $Destination -Force
            Remove-Item -LiteralPath $archive -Force
          }

          $v26100 = '10.0.26100.6584'
          Get-NugetPackage 'Microsoft.Windows.WDK.x64' $v26100 (Join-Path $nuget 'microsoft.windows.wdk.x64')
          Get-NugetPackage 'Microsoft.Windows.SDK.cpp' $v26100 (Join-Path $nuget 'microsoft.windows.sdk.cpp')
          Get-NugetPackage 'Microsoft.Windows.SDK.cpp.x64' $v26100 (Join-Path $nuget 'microsoft.windows.sdk.cpp.x64')
          Get-NugetPackage 'Microsoft.Windows.SDK.cpp.x86' $v26100 (Join-Path $nuget 'microsoft.windows.sdk.cpp.x86')
          Get-NugetPackage 'Microsoft.Windows.WDK.x64' '10.0.28000.2526' (Join-Path $nuget 'wdk-28000.2526-um')
          Get-NugetPackage 'Microsoft.Direct3D.D3D12' '1.619.6' (Join-Path $nuget 'microsoft.direct3d.d3d12.1.619.6')

          # Use the release's pinned compiler, not the earlier CI-only MSVC exception.
          $llvmRoot = Join-Path $env:GITHUB_WORKSPACE 'toolchain\llvm-23.1.4-win64'
          $clang = Join-Path $llvmRoot 'bin\clang-cl.exe'
          if (-not (Test-Path -LiteralPath $clang)) {
            $archive = Join-Path $env:RUNNER_TEMP 'clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst'
            $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/clang%2Bllvm-23.1.4-x86_64-pc-windows-msvc.tar.zst'
            Invoke-WebRequest -Uri $url -OutFile $archive
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne '1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091') { throw "LLVM archive SHA256 mismatch: $hash" }
            $extract = Join-Path $env:RUNNER_TEMP 'llvm-extract'
            New-Item -ItemType Directory -Force $extract | Out-Null
            & tar.exe -xf $archive -C $extract
            if ($LASTEXITCODE -ne 0) { throw "LLVM archive extraction failed: $LASTEXITCODE" }
            $folder = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
            if (-not $folder) { throw 'LLVM archive has no top-level directory' }
            Move-Item -LiteralPath $folder.FullName -Destination $llvmRoot
          }
          if (-not (Test-Path -LiteralPath $clang)) { throw 'Pinned clang-cl 23.1.4 was not installed' }
          & $clang --version
          if ($LASTEXITCODE -ne 0) { throw 'clang-cl version check failed' }

          $required = @(
            (Join-Path $nuget 'microsoft.windows.wdk.x64\c\Include\10.0.26100.0\um\d3d12umddi.h'),
            (Join-Path $nuget 'microsoft.windows.sdk.cpp\c\bin\10.0.26100.0\x64\dxc.exe'),
            (Join-Path $nuget 'wdk-28000.2526-um\c\Include\10.0.28000.0\um\d3d12umddi.h'),
            (Join-Path $nuget 'microsoft.direct3d.d3d12.1.619.6\build\native\include\d3d12.h')
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required build input: $path" }
          }

      - name: Build 32-bit D3D12 UMD and engine-ddi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $out = Join-Path $root 'out\d3d12-umd-x86'
          $mesa = Join-Path $root 'mesa'
          if (-not (Test-Path -LiteralPath (Join-Path $mesa 'src\util\bc250_host_bootstrap.h'))) { throw 'Pinned x86 Mesa host-contract header is missing' }

          $wdk = Join-Path $root 'toolchain\nuget\wdk-28000.2526-um\c\Include\10.0.28000.0\um'
          $api = Join-Path $root 'toolchain\nuget\microsoft.direct3d.d3d12.1.619.6\build\native\include'
          $engine = Join-Path $root 'vkd3d-proton\libs\ddi'
          $vulkan = Join-Path $root 'Vulkan-Headers\include'

          pwsh -NoProfile -File upstream\tools\build\build-umd-d3d12.ps1 -OutputDir $out -MesaSource $mesa -VulkanInclude $vulkan -EngineInclude $engine -Arch x86 -Compiler clang-cl -Flavour release -Version '0.7.216.109-tester.37' -DdiInclude $wdk -ApiInclude $api
          if ($LASTEXITCODE -ne 0) { throw "32-bit D3D12 UMD build failed: $LASTEXITCODE" }

          $dll = Join-Path $out 'amdgpu_wddm_d3d12.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw '32-bit D3D12 UMD DLL was not produced' }

          # Reject the earlier CI-only MSVC artifact: release tester.37 uses pinned clang-cl.
          $compilerRecord = Get-Content -LiteralPath (Join-Path $out 'engine-ddi\compiler.json') -Raw | ConvertFrom-Json
          if ($compilerRecord.compiler -ne 'clang-cl') { throw "Wrong UMD compiler: $($compilerRecord.compiler); expected clang-cl" }
          $dllBytes = (Get-Item -LiteralPath $dll).Length
          if ($dllBytes -lt 2MB) { throw "Suspiciously small x86 UMD: $dllBytes bytes; refusing to package" }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll)
          if ($versionInfo.ProductVersion -notlike '0.7.216.109*') { throw "Missing/wrong tester.37 version resource: $($versionInfo.ProductVersion)" }
          Write-Host "Verified release compiler=$($compilerRecord.compiler), bytes=$dllBytes, ProductVersion=$($versionInfo.ProductVersion)"
          Get-FileHash -Algorithm SHA256 $dll | Format-List
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe is missing; cannot locate the installed MSVC tools' }
          $vsInstall = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) { throw 'Could not locate the Visual Studio installation' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsInstall 'VC\Tools\MSVC\*\bin\Hostx64\x86\dumpbin.exe') -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'The x86-capable dumpbin.exe was not found in the installed MSVC toolchain' }
          & $dumpbin.FullName /headers $dll | Select-String -Pattern 'machine|14C|8664'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the built UMD DLL' }

      - name: Stage reversible installer beside the x86 UMD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'tools\install-bd253-test-umd.ps1'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'out\d3d12-umd-x86\install-bd253-test-umd.ps1'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Reversible installer script is missing' }
          Copy-Item -LiteralPath $source -Destination $destination -Force

      - name: Upload 32-bit D3D12 UMD test build
        uses: actions/upload-artifact@v4
        with:
          name: nagi-tester37-bd253-d3d12-umd-x86
          path: |
            out/d3d12-umd-x86/amdgpu_wddm_d3d12.dll
            out/d3d12-umd-x86/install-bd253-test-umd.ps1
            out/d3d12-umd-x86/engine-ddi/engine-ddi.lib
            out/d3d12-umd-x86/engine-ddi/compiler.json
          if-no-files-found: error
